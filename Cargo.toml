[package]
name = "devcon"
version = "0.2.0"
edition = "2021"
description = "Bring up a dev container and drop into its shell — VS Code-free"
license = "MIT"
repository = "https://github.com/totophe/devcon"

[[bin]]
name = "devcon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
